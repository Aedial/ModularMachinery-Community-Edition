apply from: 'gradle/scripts/helpers.gradle'

setDefaultProperty('publish_to_maven', true, false)
setDefaultProperty('publish_to_curseforge', true, false)
setDefaultProperty('publish_to_modrinth', true, false)

// CI may override these for release-candidate tags whose changelog header differs from mod_version.
setDefaultProperty('curseforge_changelog', false, '')
setDefaultProperty('curseforge_display_name', false, '')

if (propertyBool('publish_to_maven')) {
    assertProperty('maven_name')
    assertProperty('maven_url')
    publishing {
        repositories {
            maven {
                name propertyString('maven_name').replaceAll('\\s', '')
                url propertyString('maven_url')
                credentials(PasswordCredentials)
            }
        }
        publications {
            mavenJava(MavenPublication) {
                from components.java
                setGroupId(propertyString('root_package'))
                setArtifactId(propertyString('mod_id'))
            }
        }
    }
}

if (propertyBool('publish_to_curseforge')) {
    assertProperty('curseforge_project_id')
    assertProperty('release_type')
    setDefaultProperty('curseforge_debug', false, false)
    setDefaultProperty('client_side', false, true)
    setDefaultProperty('server_side', false, true)

    if (!propertyBool('client_side') && !propertyBool('server_side')) {
        throw new GradleException('At least one of client_side and server_side must be true!')
    }

    tasks.named('curseforge') {
        debugMode = propertyBool('curseforge_debug')
        apiToken = System.getenv('CURSEFORGE_TOKEN') == null ? '' : System.getenv('CURSEFORGE_TOKEN')
        dependsOn(tasks.reobfJar)

        def mainFile = upload(propertyString('curseforge_project_id'), tasks.reobfJar)
        def changelogOverride = propertyString('curseforge_changelog')
        def changelogRaw = !changelogOverride.isEmpty() ? changelogOverride :
                (propertyBool('publish_with_changelog') ? parserChangelog() : '')
        def displayNameOverride = propertyString('curseforge_display_name')

        mainFile.displayName = !displayNameOverride.isEmpty() ? displayNameOverride :
                "${propertyString('mod_name')} ${propertyString('mod_version')}"
        mainFile.releaseType = propertyString('release_type')
        if (!changelogRaw.isEmpty()) {
            mainFile.changelog = changelogRaw
            mainFile.changelogType = 'markdown'
        }
        mainFile.addJavaVersion('Java 8')
        mainFile.addModLoader('Forge')
        mainFile.addGameVersion('1.12.2')
        if (propertyBool('client_side')) mainFile.addEnvironment('Client')
        if (propertyBool('server_side')) mainFile.addEnvironment('Server')

        if (propertyBool('use_mixins')) {
            mainFile.addRelation('mixin-booter', 'requiredDependency')
        }
        if (propertyBool('use_asset_mover')) {
            mainFile.addRelation('assetmover', 'requiredDependency')
        }
    }
}

if (propertyBool('publish_to_modrinth')) {
    apply plugin: 'com.modrinth.minotaur'
    assertProperty('modrinth_project_id')
    assertProperty('release_type')
    setDefaultProperty('modrinth_debug', false, false)

    modrinth {
        token = System.getenv('MODRINTH_TOKEN') == null ? '' : System.getenv('MODRINTH_TOKEN')
        projectId = propertyString('modrinth_project_id')
        versionNumber = propertyString('mod_version')
        versionType = propertyString('release_type')
        uploadFile = tasks.reobfJar
        gameVersions = ['1.12.2']
        loaders = ['forge']
        debugMode = propertyBool('modrinth_debug')
        if (propertyBool('use_mixins') || propertyBool('use_asset_mover')) {
            dependencies {
                if (propertyBool('use_mixins')) required.project 'mixinbooter'
                if (propertyBool('use_asset_mover')) required.project 'assetmover'
            }
        }
        if (propertyBool('publish_with_changelog')) {
            changelog = parserChangelog()
        }
        if (propertyBool('modrinth_sync_readme')) {
            syncBodyFrom = file('README.md').text
            tasks.modrinth.dependsOn(tasks.modrinthSyncBody)
        }
    }
}
