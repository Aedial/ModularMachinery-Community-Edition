# Gradle
org.gradle.jvmargs = -Xmx3G
org.gradle.parallel = true
org.gradle.caching = true

# The Kotlin plugin otherwise adds kotlin-stdlib as an implementation dependency. The mod supplies it through Forgelin.
kotlin.stdlib.default.dependency = false

# Source and test options
use_modern_java_syntax = true
generate_sources_jar = true
generate_javadocs_jar = false
enable_junit_testing = false
show_testing_output = false

# Mod information
mod_version = 2.3.2
root_package = hellfirepvp.modularmachinery
mod_id = modularmachinery
mod_name = Modular Machinery: Community Edition
mod_description = A modpack-maker toolset to create custom, massive, unique and complex machines and recipes from scratch with JSON.
mod_url = https://www.curseforge.com/minecraft/mc-mods/modularmachinery-community-edition
mod_update_json =
mod_authors = HellFirePvP, wiiv, KasumiNova, youyihj, ikexing
mod_credits = HellFirePvP code, wiiv ALL THE TEXTURES :3, and KasumiNova Improvements! And more community edition contributors!
mod_logo_path = assets/modularmachinery/textures/logo.png

# Minecraft and run configurations
mapping_channel = stable
mapping_version = 39
use_dependency_at_files = true
minecraft_username = Kasumi_Nova
extra_jvm_args = -Dfml.coreMods.load=github.kasuminova.mmce.mixin.MMCEEarlyMixinLoader -Dmixin.hotSwap=true
extra_tweak_classes =
change_minecraft_sources = false

# Build-time tags
use_tags = true
tag_class_name = hellfirepvp.modularmachinery.Tags

# Access transformers
use_access_transformer = false
access_transformer_locations = ${mod_id}_at.cfg

# MixinBooter. Config loading remains in MMCEEarlyMixinLoader/MMCELateMixinLoader, so no manifest config list is used.
use_mixins = true
mixin_booter_version = 8.9
generate_mixins_json = false
mixin_configs =
mixin_refmap = mixins.mmce.refmap.json

# Coremod
is_coremod = true
coremod_includes_mod = true
coremod_plugin_class_name = github.kasuminova.mmce.mixin.MMCEEarlyMixinLoader

# Optional AssetMover support
use_asset_mover = false
asset_mover_version = 2.5

# Maven publishing (provide MAVEN_USER and MAVEN_PASS)
publish_to_maven = false
publish_to_local_maven = false
maven_name = ${mod_name}
maven_url =

# Release publishing
release_type = release
publish_with_changelog = ${{ it.file('CHANGELOG.md').exists() }}
client_side = true
server_side = true

# CurseForge (provide CURSEFORGE_TOKEN)
publish_to_curseforge = false
curseforge_project_id =
curseforge_debug = false
curseforge_changelog =
curseforge_display_name =

# Modrinth (provide MODRINTH_TOKEN)
publish_to_modrinth = false
modrinth_project_id =
modrinth_sync_readme = false
modrinth_debug = false
